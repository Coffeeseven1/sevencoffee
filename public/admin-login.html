<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>ورود مدیریت | SEVEN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--red:#d62828;--yellow:#f1c84b;--muted:#a6a29a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#3a1515,transparent 45%),linear-gradient(135deg,#090909,#121212);color:#f6f2e9;font-family:Vazirmatn,Tahoma,sans-serif}.card{width:min(100%,440px);border:1px solid #ffffff1c;border-radius:24px;padding:30px;background:linear-gradient(145deg,#1c1c1c,#111);box-shadow:0 24px 90px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:52px;height:52px;border:1px solid var(--yellow);border-radius:15px;display:grid;place-items:center;color:var(--yellow);font-size:28px;font-weight:800}.name{font-size:19px;font-weight:800;letter-spacing:2px}.subbrand{font-size:9px;letter-spacing:2px;color:var(--yellow)}h1{font-size:25px;margin:0 0 8px}p{color:var(--muted);font-size:13px;line-height:1.9;margin:0 0 24px}label{display:block;font-size:12px;color:#d9d3c8;margin:17px 0 8px;font-weight:600}input{width:100%;height:49px;border-radius:12px;border:1px solid #3a3a3a;background:#0d0d0e;color:white;padding:0 14px;font:inherit;outline:none}input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px #f1c84b18}.row{display:flex;gap:10px}.question{flex:1;display:flex;align-items:center;justify-content:center;border:1px solid #66562a;border-radius:12px;background:linear-gradient(135deg,#302716,#171511);color:var(--yellow);font-size:20px;font-weight:800;direction:ltr;min-height:49px}.refresh{width:50px;border:1px solid #3d3d3d;border-radius:12px;background:#222;color:var(--yellow);font-size:22px;cursor:pointer}.submit{width:100%;height:51px;margin-top:24px;border:1px solid #ff5757;border-radius:13px;background:linear-gradient(110deg,#b91f26,#e22a2a);color:white;font:inherit;font-weight:800;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.error{display:none;margin-top:14px;padding:11px 13px;border:1px solid #d6282866;border-radius:10px;background:#d6282814;color:#ff9c9c;font-size:12px;line-height:1.8}.foot{margin-top:22px;text-align:center;color:#777;font-size:10px}@media(max-width:480px){.card{padding:23px 19px}h1{font-size:22px}}
</style></head><body><main class="card"><div class="brand"><div class="mark">7</div><div><div class="name">SEVEN</div><div class="subbrand">CAFE & GAMES</div></div></div><h1>ورود به پنل مدیریت</h1><p>رمز عبور مدیر و پاسخ سؤال ریاضی را وارد کن.</p><form id="loginForm"><label for="password">رمز عبور مدیریت</label><input id="password" type="password" autocomplete="current-password" required placeholder="رمز مدیریت را وارد کن"><label>کپچای ریاضی تصادفی</label><div class="row"><div id="captchaQuestion" class="question">در حال دریافت…</div><button class="refresh" type="button" id="refreshCaptcha" aria-label="سؤال جدید">↻</button></div><label for="captchaAnswer">پاسخ سؤال</label><input id="captchaAnswer" inputmode="numeric" autocomplete="off" required placeholder="پاسخ را وارد کن"><button id="submitButton" class="submit" type="submit">ورود امن به پنل</button><div id="errorMessage" class="error" role="alert"></div></form><div class="foot">SEVEN · CAFE & GAMES · ADMIN ACCESS</div></main><script src="/js/admin-login.js" defer></script></body></html>
